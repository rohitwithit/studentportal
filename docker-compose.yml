services:
  database:
    image: mongo:7
    container_name: studentportal-database
    restart: always
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: studentportal
    # Only exposed inside Docker network (not to host publicly)
    ports:
      - "127.0.0.1:27017:27017"

  backend:
    build: ./server
    container_name: studentportal-backend
    restart: always
    depends_on:
      - database
    environment:
      PORT: 3000
      MONGO_URI: mongodb://database:27017/studentportal
      JWT_SECRET: CHANGE_THIS_TO_A_LONG_RANDOM_STRING
      CORS_ORIGIN: "*"
    ports:
      - "127.0.0.1:3000:3000"

  frontend:
    build: ./client
    container_name: studentportal-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
      # Uncomment later for HTTPS
      # - "443:443"

volumes:
  mongo_data: