<main class="flex min-h-screen items-center justify-center bg-slate-100 px-6">
      <div class="w-full max-w-md rounded-2xl bg-white p-8 shadow-lg">
        <a routerLink="/" class="text-sm text-cyan-600">← Back to home</a>
        <h1 class="mt-5 text-3xl font-bold">Admin Login</h1>
        <p class="mt-2 text-slate-600">Sign in to manage students.</p>

        <form [formGroup]="form" (ngSubmit)="login()" class="mt-7 space-y-5">
          <div>
            <label class="mb-1 block text-sm font-semibold">Email</label>
            <input type="email" formControlName="email" class="w-full rounded-lg border px-3 py-2" />
          </div>
          <div>
            <label class="mb-1 block text-sm font-semibold">Password</label>
            <input type="password" formControlName="password" class="w-full rounded-lg border px-3 py-2" />
          </div>

          @if (error) {
            <p class="rounded-lg bg-red-50 p-3 text-sm text-red-700">{{ error }}</p>
          }

          <button [disabled]="loading" class="w-full rounded-lg bg-slate-900 py-3 font-semibold text-white disabled:opacity-50">
            {{ loading ? 'Signing in...' : 'Login' }}
          </button>
        </form>
      </div>
    </main>
